[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yeokcham-content"
version = "0.1.0"
requires-python = ">=3.13"
description = "Experimental pure retained-content core; no repository access"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
dev = ["ruff>=0.11", "mypy>=1.15", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
