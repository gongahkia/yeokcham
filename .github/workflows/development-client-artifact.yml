name: Development client artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/development-client-artifact.yml"
      - ".dockerignore"
      - "containers/client/**"
      - "packaging/**"
      - "tools/**"
      - "test/test_development_artifact.ml"
      - "test/test_development_artifacts.sh"
      - "test/test_development_build_record.sh"
      - "bin/**"
      - "lib/**"
      - "dune"
      - "dune-project"
      - "Makefile"
      - "yeokcham.opam"
      - "yeokcham.opam.locked"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-and-smoke:
    if: github.repository == 'gongahkia/yeokcham' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_DIRECTORY: ${{ runner.temp }}/yeokcham-development-artifacts
      WORKFLOW_IDENTITY: https://github.com/gongahkia/yeokcham/.github/workflows/development-client-artifact.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - run: make ci
      - run: make development-build-record-test
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build unsigned client archive, RPM, SBOM, and provenance
        run: |
          mkdir "$ARTIFACT_DIRECTORY"
          tools/build-development-artifacts.sh --output "$ARTIFACT_DIRECTORY"
          (cd "$ARTIFACT_DIRECTORY" && sha256sum --check SHA256SUMS)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the artifact checksum manifest with keyless OIDC
        run: |
          cosign sign-blob --yes \
            --bundle "$ARTIFACT_DIRECTORY/SHA256SUMS.sigstore.json" \
            "$ARTIFACT_DIRECTORY/SHA256SUMS"
          cosign verify-blob "$ARTIFACT_DIRECTORY/SHA256SUMS" \
            --bundle "$ARTIFACT_DIRECTORY/SHA256SUMS.sigstore.json" \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER"
      - name: Write the canonical external build record
        run: |
          tools/write-development-build-record.sh \
            --directory "$ARTIFACT_DIRECTORY" \
            --bundle SHA256SUMS.sigstore.json \
            --workflow-identity "$WORKFLOW_IDENTITY" \
            --oidc-issuer "$OIDC_ISSUER"
      - name: Sign and verify the external build record with keyless OIDC
        run: |
          cosign sign-blob --yes \
            --bundle "$ARTIFACT_DIRECTORY/development-build-record-v1.json.sigstore.json" \
            "$ARTIFACT_DIRECTORY/development-build-record-v1.json"
          cosign verify-blob "$ARTIFACT_DIRECTORY/development-build-record-v1.json" \
            --bundle "$ARTIFACT_DIRECTORY/development-build-record-v1.json.sigstore.json" \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER"
      - name: Smoke the signed development artifacts
        run: |
          YEOKCHAM_DEVELOPMENT_ARTIFACTS="$ARTIFACT_DIRECTORY" \
            make development-artifact-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yeokcham-development-client-${{ github.sha }}
          path: ${{ env.ARTIFACT_DIRECTORY }}
          if-no-files-found: error
          retention-days: 14
