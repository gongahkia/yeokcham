name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy --component rustfmt --no-self-update
      - name: Run CI gate
        run: make ci
