[workspace]
members = ["crates/yeokcham-cli", "crates/yeokcham-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
gix = { version = "=0.85.0", default-features = false, features = ["sha1", "sha256"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
jsonschema = { version = "0.49.2", default-features = false }
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"] }
serde_json = "1.0.151"
sha1 = { version = "0.10.7", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
thiserror = "2.0.19"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", default-features = false, features = ["v4"] }
