[workspace]
members = ["crates/yeokcham-cli", "crates/yeokcham-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
fastcdc = { version = "=4.0.1", default-features = false }
flate2 = { version = "=1.1.1", default-features = false, features = ["zlib-rs"] }
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
gix = { version = "=0.85.0", default-features = false, features = ["sha1", "sha256"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
hkdf = { version = "=0.13.0", default-features = false }
jsonschema = { version = "0.49.2", default-features = false }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"] }
serde_json = "1.0.151"
sha1 = { version = "0.10.7", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "2.0.19"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
ureq = { version = "=2.12.1", default-features = false, features = ["json", "tls"] }
uuid = { version = "1.24.0", default-features = false, features = ["v4"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
