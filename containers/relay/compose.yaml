services:
  relay:
    image: ${YEOKCHAM_RELAY_IMAGE:?set an immutable yeokcham relay image digest}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    volumes: [relay-data:/var/lib/yeokcham-relay]
    expose: ["8080", "8081", "9090"]
    networks: [relay-private]

  proxy:
    image: ${NGINX_IMAGE:-docker.io/library/nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284}
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/var/cache/nginx:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=0700, /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0755]
    ports: ["443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE:?set certificate path}:/run/tls/tls.crt:ro
      - ${TLS_PRIVATE_KEY:?set private-key path}:/run/tls/tls.key:ro
    depends_on: [relay]
    networks: [relay-private]

volumes:
  relay-data:

networks:
  relay-private:
    internal: true
